<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Some Louvre Paintings</title>
<meta name="description" content="루브르 박물관에서 촬영한 회화 35점">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #1c1a17;
    --muted: #77716a;
    --line: #dcd6cb;
    --mat: #e9e4da;
    --accent: #8b2e24;
    --serif: "Cormorant Garamond", "Times New Roman", "Nanum Myeongjo", serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    --row: 230px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12110f;
      --fg: #ece7de;
      --muted: #8f887e;
      --line: #2b2925;
      --mat: #1c1a17;
      --accent: #d9917c;
    }
  }
  @media (max-width: 640px) { :root { --row: 150px; } }
  @media (orientation: landscape) and (max-height: 500px) { :root { --row: 140px; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  @media (min-width: 900px) { .wrap { padding-left: 48px; padding-right: 48px; } }

  /* ── 목록 헤더 ── */
  .hero { padding-top: max(56px, env(safe-area-inset-top)); padding-bottom: 40px; }
  .eyebrow {
    margin: 0 0 18px;
    font-size: 11px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(44px, 8vw, 96px);
    line-height: .95; letter-spacing: -.02em;
  }
  h1 em { font-style: italic; color: var(--muted); }
  .lede { margin: 22px 0 0; max-width: 34em; color: var(--muted); font-size: 15px; }
  .meta {
    display: flex; gap: 24px; flex-wrap: wrap;
    margin-top: 32px; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    letter-spacing: .04em;
  }
  .meta b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (orientation: landscape) and (max-height: 500px) {
    .hero { padding-top: 24px; padding-bottom: 20px; }
    h1 { font-size: 40px; }
    .lede, .meta { display: none; }
  }

  /* ── 목록: 원본 비율 유지 justified row (각 행 높이 동일, 순서 유지) ── */
  .grid {
    list-style: none; margin: 0; padding: 0 0 72px;
    display: flex; flex-wrap: wrap;
    gap: 36px 20px;
  }
  .grid::after { content: ""; flex-grow: 999; }
  .grid li { flex: var(--ar) 1 calc(var(--ar) * var(--row)); min-width: 0; }
  @media (max-width: 640px) { .grid { gap: 24px 12px; } }
  .grid button {
    all: unset; display: block; width: 100%; cursor: pointer;
  }
  .frame {
    position: relative;
    aspect-ratio: var(--ar);
    background: var(--mat);
    overflow: hidden;
  }
  .frame img {
    width: 100%; height: 100%; display: block; object-fit: cover;
    opacity: 0;
    transition: opacity .5s ease, transform .7s var(--ease), filter .4s ease;
  }
  .frame img.ready { opacity: 1; }
  .grid button:hover .frame img { transform: scale(1.035); }
  .grid button:focus-visible .frame { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cap { padding-top: 12px; }
  .cap .n {
    font-size: 10px; font-weight: 600; letter-spacing: .16em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .cap .t {
    margin-top: 3px;
    font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    transition: color .2s ease;
  }
  .cap .a {
    margin-top: 4px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .grid button:hover .t { color: var(--accent); }
  @media (max-width: 640px) {
    .cap { padding-top: 8px; }
    .cap .t { font-size: 15px; }
    .cap .a { font-size: 11px; }
  }

  footer {
    padding-top: 24px; padding-bottom: max(40px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  footer a { color: inherit; }

  /* ── 상세 보기 ── */
  .viewer {
    --v-fg: #f1ece3;
    --v-muted: #a49d92;
    position: fixed; inset: 0; z-index: 10;
    height: 100dvh;
    background: #0d0c0b;
    color: var(--v-fg);
    display: grid;
    /* minmax(0, …): 이미지 원본 크기가 트랙을 밀어내 화면 밖으로 넘치는 것 방지 */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bar" "stage" "info" "strip";
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
    overflow: hidden;
  }
  .viewer.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
  /* 현재 작품을 흐리게 깔아 전시실 조명 같은 분위기 */
  .backdrop {
    position: absolute; inset: -10%;
    background: center / cover no-repeat;
    filter: blur(70px) saturate(1.3) brightness(.32);
    transition: background-image .6s ease;
    pointer-events: none;
  }
  .viewer > :not(.backdrop) { position: relative; }

  .bar {
    grid-area: bar;
    display: flex; align-items: center; gap: 6px;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  }
  .bar .count {
    margin-right: auto;
    font-size: 11px; font-weight: 600; letter-spacing: .18em;
    color: var(--v-muted); font-variant-numeric: tabular-nums;
  }
  .bar .count b { color: var(--v-fg); font-weight: 600; }
  .ic {
    all: unset; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%;
    display: inline-grid; place-items: center;
    color: var(--v-fg);
    transition: background .2s ease;
  }
  .ic svg { width: 20px; height: 20px; }
  .ic:hover { background: rgba(255,255,255,.1); }
  .ic:focus-visible { outline: 1px solid rgba(255,255,255,.45); outline-offset: -1px; }

  .stage {
    grid-area: stage;
    overflow: hidden;
    min-width: 0; min-height: 0;
    touch-action: pan-y pinch-zoom;
    margin: 4px max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left));
  }
  .stage img {
    /* 회전 시 레이아웃 박스가 stage보다 커져도 중앙 유지되도록 절대 위치 + translate 로 정렬 */
    position: absolute; top: 50%; left: 50%;
    --rot: 0deg; --shift: 0px;
    transform: translate(-50%, -50%) translateX(var(--shift)) rotate(var(--rot));
    display: block;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.35);
    transition: transform .45s var(--ease), opacity .35s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .stage img.out { opacity: 0; }
  .spinner {
    position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px;
    border: 2px solid rgba(255,255,255,.15); border-top-color: var(--v-fg); border-radius: 50%;
    animation: spin .8s linear infinite;
    opacity: 0; transition: opacity .2s ease .25s;
  }
  .stage.loading .spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px;
    background: rgba(20,18,16,.45);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    opacity: .85;
  }
  .nav:hover { background: rgba(20,18,16,.7); opacity: 1; }
  .nav.prev { left: 4px; }
  .nav.next { right: 4px; }
  @media (hover: none) { .nav { opacity: .6; } }

  .info {
    grid-area: info;
    padding: 14px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
  }
  .info .no {
    font-size: 10px; font-weight: 600; letter-spacing: .2em; color: var(--v-muted);
    font-variant-numeric: tabular-nums;
  }
  .info h2 {
    margin: 6px 0 0;
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(22px, 3vw, 34px); line-height: 1.1;
  }
  .info .artist {
    margin-top: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--v-muted);
  }
  .info .note {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
    font-size: 13px; color: var(--v-muted);
  }
  .info .note:empty { display: none; }

  /* ── 작품 설명 (상세 모드) ── */
  .info { min-height: 0; overscroll-behavior: contain; }
  .more {
    all: unset; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 8px 14px 8px 12px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--v-fg);
    transition: background .2s ease;
  }
  .more:hover { background: rgba(255,255,255,.08); }
  .more:focus-visible { outline: 1px solid rgba(255,255,255,.45); outline-offset: 2px; }
  .more svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
  .more[hidden] { display: none; }
  .viewer.detail .more svg { transform: rotate(45deg); }
  .handle { display: none; }

  .desc { display: none; max-width: 34em; margin-top: 18px; }
  .viewer.detail .desc { display: block; animation: rise .45s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .desc dl {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 18px;
    margin: 0; padding: 12px 0;
    border-top: 1px solid rgba(255,255,255,.12);
    border-bottom: 1px solid rgba(255,255,255,.12);
    font-size: 12px;
  }
  .desc dt { color: var(--v-muted); letter-spacing: .06em; }
  .desc dd { margin: 0; }
  .desc .body { margin-top: 18px; }
  .desc .body p { margin: 0 0 1em; font-size: 15px; line-height: 1.75; color: rgba(241,236,227,.86); }
  .desc .src { margin: 6px 0 4px; font-size: 12px; line-height: 1.9; color: var(--v-muted); overflow-wrap: anywhere; }
  .desc .src a { color: var(--v-fg); text-underline-offset: 3px; }

  /* 세로 화면: 하단 시트. 그림은 위쪽으로 줄여 계속 보이게 하고, 시트 내부만 스크롤 */
  @media (orientation: portrait) {
    .viewer.detail {
      grid-template-rows: auto minmax(0, 38%) minmax(0, 1fr);
      grid-template-areas: "bar" "stage" "info";
    }
    .viewer.detail .strip { display: none; }
    .viewer.detail .info {
      overflow-y: auto;
      margin-top: 8px;
      padding-top: 0;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: rgba(22,20,18,.94);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    }
    .viewer.detail .handle {
      all: unset; cursor: pointer;
      display: block; position: sticky; top: 0; z-index: 1;
      width: calc(100% + 40px); height: 22px; margin: 0 -20px 4px;
      background: rgba(22,20,18,.94);
    }
    .viewer.detail .handle::before {
      content: ""; position: absolute; top: 9px; left: 50%;
      width: 36px; height: 4px; margin-left: -18px;
      border-radius: 2px; background: rgba(255,255,255,.28);
    }
  }

  /* 하단 필름스트립: 상세 화면 안에서 다른 작품으로 바로 이동 */
  .strip {
    grid-area: strip;
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    padding: 8px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    scroll-padding: 0 40%;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip button {
    all: unset; cursor: pointer; flex: none;
    height: 52px; aspect-ratio: var(--ar);
    opacity: .38;
    transition: opacity .25s ease, transform .25s var(--ease);
  }
  .strip button:hover { opacity: .75; }
  .strip button[aria-current="true"] {
    opacity: 1;
    box-shadow: 0 0 0 2px var(--v-fg);
  }
  .strip button:focus-visible { box-shadow: 0 0 0 2px var(--accent); opacity: 1; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 가로 화면: 오른쪽에 정보 패널, 그림은 세로 공간 최대 사용 */
  @media (orientation: landscape) {
    .viewer {
      grid-template-columns: minmax(0, 1fr) clamp(240px, 26vw, 360px);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "bar bar" "stage info" "strip strip";
    }
    .info { align-self: end; padding-bottom: 28px; padding-left: 8px; }
    /* 가로 화면 상세 모드: 오른쪽 패널을 넓히고 위에서부터 스크롤. 그림은 grid 열 변화로 자동 축소 */
    .viewer.detail { grid-template-columns: minmax(0, 1fr) clamp(320px, 36vw, 500px); }
    .viewer.detail .info {
      align-self: stretch; overflow-y: auto;
      padding-top: 18px; padding-right: max(28px, env(safe-area-inset-right)); padding-left: 24px;
      border-left: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.18);
    }
  }
  /* 휴대폰 가로: 세로 공간이 매우 좁으므로 필름스트립 숨김 */
  @media (orientation: landscape) and (max-height: 500px) {
    .viewer { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "bar bar" "stage info"; }
    .strip { display: none; }
    .info { padding-bottom: max(14px, env(safe-area-inset-bottom)); overflow-y: auto; }
    .info .note { display: none; }
    .viewer.detail .info .note:not(:empty) { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Musée du Louvre · Paris</p>
    <h1>Some Louvre <em>Paintings</em></h1>
    <p class="lede">루브르 박물관에서 직접 촬영한 회화 35점. 작품을 눌러 크게 보고, 좌우로 넘기며 감상하세요. 「작품 설명」에서 작품별 해설을 볼 수 있습니다.</p>
    <div class="meta"><span><b>35</b> works</span><span><b>13th–19th</b> century</span><span>Cimabue → Delacroix</span></div>
  </header>

  <ul class="grid" id="grid"></ul>

  <footer>
    <span>작가·작품 표기 근거는 README 참고 · 사진: iPhone 14 Plus</span>
    <a href="https://github.com/pathcosmos/some-louvre-paintings">GitHub</a>
  </footer>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-title" aria-hidden="true">
  <div class="backdrop" id="v-bg"></div>
  <div class="bar">
    <span class="count" id="v-count"></span>
    <button class="ic" id="v-rotate" title="90° 회전 (R)" aria-label="90도 회전">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <a class="ic" id="v-orig" target="_blank" rel="noopener" title="원본 해상도" aria-label="원본 해상도 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
    <button class="ic" id="v-close" title="닫기 (Esc)" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="stage" id="v-stage">
    <img id="v-img" alt="">
    <div class="spinner"></div>
    <button class="ic nav prev" id="v-prev" title="이전 (←)" aria-label="이전 작품">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="ic nav next" id="v-next" title="다음 (→)" aria-label="다음 작품">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="info" id="v-info">
    <button class="handle" id="v-handle" aria-label="작품 설명 닫기"></button>
    <div class="no" id="v-no"></div>
    <h2 id="v-title"></h2>
    <div class="artist" id="v-artist"></div>
    <button class="more" id="v-more" aria-expanded="false" aria-controls="v-detail" title="작품 설명 (I)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="v-more-label">작품 설명</span>
    </button>
    <div class="note" id="v-note"></div>
    <section class="desc" id="v-detail" aria-label="작품 설명"></section>
  </div>
  <div class="strip" id="v-strip" aria-label="작품 목록"></div>
</div>

<script src="details.js"></script>
<script>
// 파일명은 jpg/rename_map.csv 의 new 컬럼과 동일해야 함 (thumbs/, web/, jpg/ 에 같은 이름으로 존재)
const WORKS = [
  ["01-Cimabue_Maesta.jpg", "Cimabue", "Maestà (Madonna and Child in Majesty Surrounded by Angels)"],
  ["02-Leonardo-da-Vinci_Mona-Lisa-wide.jpg", "Leonardo da Vinci", "Mona Lisa", "전시 공간 전경"],
  ["03-Leonardo-da-Vinci_Mona-Lisa-close.jpg", "Leonardo da Vinci", "Mona Lisa", "근접 촬영"],
  ["04-Raphael-and-Giulio-Romano_Isabel-de-Requesens.jpg", "Raphael and Giulio Romano", "Portrait of Isabel de Requesens", "옛 통칭: Joanna of Aragon"],
  ["05-Fetti_Guardian-Angel.jpg", "Domenico Fetti", "The Guardian Angel"],
  ["06-Pellegrini_Diana-and-Endymion.jpg", "Giovanni Antonio Pellegrini", "Diana and Endymion"],
  ["07-Carreno-de-Miranda-and-Rizi_Foundation-of-the-Trinitarian-Order.jpg", "Juan Carreño de Miranda and Francisco Rizi", "Mass for the Foundation of the Trinitarian Order"],
  ["08-Goya_Young-Woman-with-Fan.jpg", "Francisco de Goya", "Young Woman with a Fan"],
  ["09-Goya_Marquesa-de-Santa-Cruz.jpg", "Francisco de Goya", "Marquesa de Santa Cruz (Mariana Waldstein)"],
  ["10-Goya_Disparate-Rain-of-Bulls.jpg", "Francisco de Goya", "Disparate: Rain of Bulls", "Disparates 동판 원판 (Chalcographie du Louvre)"],
  ["11-Goya_Disparate-Other-Laws-for-the-People.jpg", "Francisco de Goya", "Disparate: Other Laws for the People", "Disparates 동판 원판 (Chalcographie du Louvre)"],
  ["12-Goya_Disparate-Queen-of-the-Circus.jpg", "Francisco de Goya", "Disparate: A Queen of the Circus", "Disparates 동판 원판 (Chalcographie du Louvre)"],
  ["13-Goya_Disparate-What-a-Warrior.jpg", "Francisco de Goya", "Disparate: What a Warrior!", "Disparates 동판 원판 (Chalcographie du Louvre)"],
  ["14-Gessi_Virgin-and-Child.jpg", "Francesco Gessi", "Virgin and Child", "오랫동안 Guido Reni 작품으로 여겨짐"],
  ["15-Reni_Union-of-Drawing-and-Colour.jpg", "Guido Reni", "The Union of Drawing and Colour"],
  ["16-Raphael_Baldassare-Castiglione.jpg", "Raphael", "Portrait of Baldassare Castiglione"],
  ["17-Raphael_Saint-Michael-Vanquishing-Satan.jpg", "Raphael", "Saint Michael Vanquishing Satan"],
  ["18-Fra-Bartolomeo_Minerva.jpg", "Fra Bartolomeo", "Minerva", "작가 귀속이 여러 차례 바뀐 작품 · 루브르 현재 귀속: Fra Bartolomeo"],
  ["19-Piero-della-Francesca_Sigismondo-Malatesta.jpg", "Piero della Francesca", "Portrait of Sigismondo Pandolfo Malatesta"],
  ["20-David_Madame-Seriziat-and-Her-Son.jpg", "Jacques-Louis David", "Madame Sériziat and Her Son"],
  ["21-Guerin_Return-of-Marcus-Sextus.jpg", "Pierre-Narcisse Guérin", "The Return of Marcus Sextus"],
  ["22-Drouais_Marius-at-Minturnae.jpg", "Germain-Jean Drouais", "Marius at Minturnae"],
  ["23-David_The-Sabine-Women.jpg", "Jacques-Louis David", "The Intervention of the Sabine Women"],
  ["24-David_Coronation-of-Napoleon.jpg", "Jacques-Louis David", "The Coronation of Napoleon"],
  ["25-Workshop-of-David_Death-of-Marat.jpg", "Workshop of Jacques-Louis David", "The Death of Marat", "공방 복제본 · 원작은 브뤼셀 벨기에 왕립미술관"],
  ["26-David_Oath-of-the-Horatii.jpg", "Jacques-Louis David", "Oath of the Horatii"],
  ["27-David_Madame-Recamier.jpg", "Jacques-Louis David", "Madame Récamier"],
  ["28-Gerard_Marquise-Visconti.jpg", "François Gérard", "Portrait of the Marquise Visconti"],
  ["29-Ingres_Mademoiselle-Caroline-Riviere.jpg", "Jean-Auguste-Dominique Ingres", "Mademoiselle Caroline Rivière"],
  ["30-Guerin_Clytemnestra-Hesitating-before-Agamemnon.jpg", "Pierre-Narcisse Guérin", "Clytemnestra Hesitating before Killing the Sleeping Agamemnon"],
  ["31-Girodet_Pygmalion-and-Galatea.jpg", "Anne-Louis Girodet", "Pygmalion and Galatea"],
  ["32-Ingres_La-Grande-Odalisque.jpg", "Jean-Auguste-Dominique Ingres", "La Grande Odalisque"],
  ["33-Delacroix_Liberty-Leading-the-People.jpg", "Eugène Delacroix", "Liberty Leading the People"],
  ["34-Gerard_Daphnis-and-Chloe.jpg", "François Gérard", "Daphnis and Chloe"],
  ["35-Delacroix_Death-of-Sardanapalus.jpg", "Eugène Delacroix", "The Death of Sardanapalus"],
].map(([file, artist, title, note = ""], i) => ({ file, artist, title, note, n: i + 1 }));

// 사진 가로/세로 비율 (thumbs/ 기준). 이미지 로드 전 레이아웃을 고정해 목록이 밀리지 않게 함
const RATIOS = [0.648, 0.562, 0.562, 0.856, 0.706, 0.646, 0.704, 0.817, 0.727, 1.326, 1.348, 1.283, 1.337, 0.981, 0.931,
  0.896, 0.669, 0.596, 0.856, 0.802, 1.086, 1.154, 1.270, 1.333, 0.838, 1.283, 1.237, 0.700, 0.744, 0.998, 0.860, 1.491,
  1.157, 1.096, 1.218];
WORKS.forEach((w, i) => { w.ar = RATIOS[i]; });

const $ = (id) => document.getElementById(id);
const grid = $("grid"), viewer = $("viewer"), img = $("v-img"), stage = $("v-stage"), strip = $("v-strip");
const pad = (n) => String(n).padStart(2, "0");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cur = -1, rot = 0, lastFocus = null, token = 0;
// wantDetail: 사용자가 설명을 열어 둔 상태. 설명 없는 작품을 지나도 유지되어, 다음 설명 있는 작품에서 다시 펼쳐짐
let wantDetail = false;
const info = $("v-info"), more = $("v-more");

function renderDetail(w) {
  const d = DETAILS[w.n];
  more.hidden = !d;
  // refs: 루브르 기록 외에 해설 작성에 쓴 보조 출처. 도메인만 짧게 표시
  const host = (u) => new URL(u).hostname.replace(/^www\./, "");
  $("v-detail").innerHTML = d ? `
    <dl>${d.meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="body">${d.body.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    <p class="src">출처 · <a href="${esc(d.src)}" target="_blank" rel="noopener">Louvre Collections ↗</a>${d.refs.length ? `<br>참고 · ${d.refs.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join(" · ")}` : ""}</p>` : "";
  syncDetail();
  info.scrollTop = 0;
}

function syncDetail() {
  const on = wantDetail && !more.hidden;
  viewer.classList.toggle("detail", on);
  more.setAttribute("aria-expanded", String(on));
  $("v-more-label").textContent = on ? "설명 닫기" : "작품 설명";
}

function setDetail(on) {
  wantDetail = on;
  syncDetail();
  if (on) info.scrollTop = 0;
}

// 목록 렌더링
grid.innerHTML = WORKS.map((w, i) => `
  <li style="--ar:${w.ar}"><button data-i="${i}" aria-label="${w.n}. ${esc(w.title)} — ${esc(w.artist)}">
    <div class="frame"><img src="thumbs/${w.file}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ready')"></div>
    <div class="cap"><div class="n">NO. ${pad(w.n)}</div><div class="t">${esc(w.title)}</div><div class="a">${esc(w.artist)}</div></div>
  </button></li>`).join("");
grid.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) open(+b.dataset.i);
});

strip.innerHTML = WORKS.map((w, i) => `
  <button data-i="${i}" style="--ar:${w.ar}" aria-label="${w.n}. ${esc(w.title)}"><img src="thumbs/${w.file}" alt="" loading="lazy"></button>`).join("");
strip.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) show(+b.dataset.i);
});

// 회전 시 90/270도면 가로세로가 바뀌므로 stage 크기를 기준으로 max 크기를 교차 적용
function applyRotation() {
  const quarter = ((rot % 360) + 360) % 360;
  img.style.setProperty("--rot", `${rot}deg`);
  if (quarter === 90 || quarter === 270) {
    const r = stage.getBoundingClientRect();
    img.style.maxWidth = r.height + "px";
    img.style.maxHeight = r.width + "px";
  } else {
    img.style.maxWidth = img.style.maxHeight = "";
  }
}

function show(i, dir = 0) {
  const prev = cur;
  cur = (i + WORKS.length) % WORKS.length;
  if (!dir && prev >= 0 && prev !== cur) dir = cur > prev ? 1 : -1;
  const w = WORKS[cur];
  const my = ++token;

  // 이전 이미지를 진행 방향 반대로 살짝 밀며 페이드아웃 → 새 이미지 로드 후 페이드인
  rot = 0;
  img.style.transition = "none";
  img.classList.add("out");
  img.style.setProperty("--shift", `${dir * 24}px`);
  applyRotation();
  stage.classList.add("loading");
  const next = new Image();
  next.onload = next.onerror = () => {
    if (my !== token) return; // 빠르게 넘길 때 늦게 도착한 이전 이미지 무시
    img.src = next.src;
    img.alt = `${w.title} — ${w.artist}`;
    stage.classList.remove("loading");
    // rAF 대신 강제 reflow: 백그라운드 탭 등 rAF가 멈추는 환경에서도 이미지가 투명하게 남지 않도록
    void img.offsetWidth;
    img.style.transition = "";
    img.classList.remove("out");
    img.style.setProperty("--shift", "0px");
  };
  next.src = `web/${w.file}`;

  $("v-bg").style.backgroundImage = `url("thumbs/${w.file}")`;
  $("v-count").innerHTML = `<b>${pad(w.n)}</b> / ${WORKS.length}`;
  $("v-no").textContent = `NO. ${pad(w.n)}`;
  $("v-title").textContent = w.title;
  $("v-artist").textContent = w.artist;
  $("v-note").textContent = w.note;
  $("v-orig").href = `jpg/${w.file}`;
  renderDetail(w);

  strip.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", j === cur ? "true" : "false"));
  const sb = strip.children[cur];
  if (sb && strip.offsetParent) {
    strip.scrollTo({ left: sb.offsetLeft - strip.clientWidth / 2 + sb.offsetWidth / 2, behavior: prev < 0 ? "auto" : "smooth" });
  }

  // 이웃 작품 미리 로드 → 다음/이전 이동 시 대기 감소
  [cur - 1, cur + 1].forEach((j) => { new Image().src = `web/${WORKS[(j + WORKS.length) % WORKS.length].file}`; });
  const hash = `#${w.n}`;
  if (location.hash !== hash) history.replaceState(history.state, "", hash);
}

function open(i) {
  lastFocus = document.activeElement;
  // 상세 진입은 history에 한 단계 추가 → 모바일 뒤로가기로 닫기 가능
  if (!viewer.classList.contains("open")) history.pushState({ viewer: true }, "", `#${WORKS[i].n}`);
  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  cur = -1;
  show(i);
  $("v-close").focus({ preventScroll: true });
}

function close(fromPop = false) {
  if (!viewer.classList.contains("open")) return;
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  token++;
  setDetail(false);
  if (!fromPop) {
    if (history.state && history.state.viewer) history.back();
    else history.replaceState(null, "", location.pathname + location.search);
  }
  const b = grid.querySelector(`button[data-i="${cur}"]`);
  b?.scrollIntoView({ block: "nearest" });
  (b || lastFocus)?.focus({ preventScroll: true });
}

const go = (d) => show(cur + d, d);
const rotate = () => { rot += 90; applyRotation(); };
$("v-prev").onclick = () => go(-1);
$("v-next").onclick = () => go(1);
$("v-close").onclick = () => close();
$("v-rotate").onclick = rotate;
more.onclick = () => setDetail(!viewer.classList.contains("detail"));
$("v-handle").onclick = () => setDetail(false);

document.addEventListener("keydown", (e) => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  // Esc: 설명이 열려 있으면 설명만 먼저 닫음
  else if (e.key === "Escape") viewer.classList.contains("detail") ? setDetail(false) : close();
  else if (e.key === "r" || e.key === "R") rotate();
  else if ((e.key === "i" || e.key === "I") && !more.hidden) setDetail(!viewer.classList.contains("detail"));
});

// 세로 화면 시트: 맨 위까지 스크롤된 상태에서 아래로 끌면 설명 닫기
let sy = 0, sx = 0, sTop = 0;
info.addEventListener("touchstart", (e) => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; sTop = info.scrollTop;
}, { passive: true });
info.addEventListener("touchend", (e) => {
  if (!viewer.classList.contains("detail") || !matchMedia("(orientation: portrait)").matches || sTop > 0) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (dy > 70 && dy > Math.abs(dx) * 1.5) setDetail(false);
}, { passive: true });

// 설명 열고 닫을 때 stage 크기가 바뀌므로 회전 상태 크기 재계산
new ResizeObserver(() => { if (viewer.classList.contains("open")) applyRotation(); }).observe(stage);

// 스와이프: 수평 이동이 충분하고 수직보다 클 때만 이전/다음 (핀치 줌 중에는 무시)
let tx = 0, ty = 0, multi = false;
stage.addEventListener("touchstart", (e) => {
  multi = e.touches.length > 1;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (multi || (window.visualViewport && window.visualViewport.scale > 1.01)) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });

// 기기 회전·창 크기 변경 시 회전 상태의 크기 재계산
window.addEventListener("resize", () => { if (viewer.classList.contains("open")) applyRotation(); });

window.addEventListener("popstate", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= WORKS.length) open(n - 1);
  else close(true);
});

// #12 같은 주소로 바로 진입 시 해당 작품 상세 열기
(() => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= WORKS.length) {
    history.replaceState(null, "", location.pathname + location.search);
    open(n - 1);
  }
})();
</script>
</body>
</html>
